name: Publish Existing Build to Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful build run ID in this repository'
        required: true
        type: string
      source_sha:
        description: 'Exact commit SHA expected for the build'
        required: true
        type: string
      release_tag:
        description: 'Release tag'
        default: 'v1.0.5'
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify successful build and source commit
        uses: actions/github-script@v7
        env:
          BUILD_RUN_ID: ${{ inputs.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        with:
          script: |
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(process.env.BUILD_RUN_ID)
            });
            if (run.conclusion !== 'success' || run.head_sha !== process.env.SOURCE_SHA) {
              throw new Error('Build must succeed and match the expected source commit');
            }
            const allowed = ['.github/workflows/build-macos.yml', '.github/workflows/build-windows.yml', '.github/workflows/build-ubuntu.yml'];
            if (!allowed.includes(run.path)) throw new Error('Not a desktop build workflow');
      - name: Download verified build artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id }}
          path: artifacts
      - name: Publish installation assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir release-dist
          for artifact in artifacts/*; do
            [ -d "$artifact" ] || continue
            for file in "$artifact"/*; do
              [ -f "$file" ] || continue
              [ -s "$file" ] || { echo "Empty artifact: $file"; exit 1; }
              name=$(basename "$file")
              if [ "$name" = SHA256SUMS.txt ]; then
                name="$(basename "$artifact")-SHA256SUMS.txt"
              fi
              cp "$file" "release-dist/$name"
            done
          done
          [ -n "$(find release-dist -type f -print -quit)" ]
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --title "Mobius $RELEASE_TAG" --notes 'Latest Mobius desktop release. Platform installers are added as their builds complete. Artifact filenames retain the upstream VS Code engine version (1.126.0).' --latest
          fi
          gh release upload "$RELEASE_TAG" release-dist/* --clobber
          gh release view "$RELEASE_TAG" --json url,assets --jq '{url, assets: [.assets[] | {name, size, state}]}'
