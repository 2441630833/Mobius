name: Build Ubuntu Linux (.deb & tar.gz)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target Architecture'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - x64
          - arm64
      release_tag:
        description: 'Existing release tag to publish to; leave empty for artifacts only (or tag push)'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

jobs:
  build-ubuntu:
    name: Build Linux (${{ matrix.arch }})
    if: |
      github.event_name == 'push' ||
      inputs.arch == 'all' ||
      inputs.arch == matrix.arch
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            label: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
            label: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout Mobius repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout required submodules (vscode & continue)
        run: |
          git submodule update --init --recursive vscode continue

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libsecret-1-dev \
            libx11-dev \
            libxkbfile-dev \
            libkrb5-dev \
            fakeroot \
            dpkg-dev \
            tar \
            xz-utils

      - name: Check build prerequisites
        run: |
          chmod +x scripts/*.sh *.sh
          bash scripts/check-prerequisites-linux.sh

      - name: Build and package Mobius for Ubuntu
        run: |
          bash scripts/package-linux.sh --arch "${{ matrix.arch }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobius-ubuntu-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (inputs.release_tag != '' && inputs.release_tag != null)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/*
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
