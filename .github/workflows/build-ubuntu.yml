name: Build Ubuntu Linux (.deb & tar.gz)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target Architecture'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - x64
          - arm64
      release_tag:
        description: 'Existing release tag to publish to; leave empty for artifacts only (or tag push)'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

jobs:
  # =========================================================================
  # 1. Ubuntu Linux (x64 / amd64) Build
  # =========================================================================
  build-ubuntu-x64:
    name: Build Ubuntu Linux (x64)
    if: |
      github.event_name == 'push' ||
      inputs.arch == 'all' ||
      inputs.arch == 'x64'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout Mobius repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout required submodules (vscode, continue, ECC)
        run: |
          git submodule update --init --recursive vscode continue ECC

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libsecret-1-dev \
            libx11-dev \
            libxkbfile-dev \
            libkrb5-dev \
            fakeroot \
            dpkg-dev \
            tar \
            xz-utils

      - name: Check build prerequisites
        run: |
          chmod +x scripts/*.sh *.sh
          bash scripts/check-prerequisites-linux.sh

      - name: Build and package Mobius for Ubuntu (x64)
        run: |
          bash scripts/package-linux.sh --arch x64

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobius-ubuntu-x64
          path: dist/*
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (inputs.release_tag != '' && inputs.release_tag != null)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/*
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # 2. Ubuntu Linux (arm64 / AArch64) Build
  # =========================================================================
  build-ubuntu-arm64:
    name: Build Ubuntu Linux (arm64)
    if: |
      github.event_name == 'push' ||
      inputs.arch == 'all' ||
      inputs.arch == 'arm64'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout Mobius repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout required submodules (vscode, continue, ECC)
        run: |
          git submodule update --init --recursive vscode continue ECC

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libsecret-1-dev \
            libx11-dev \
            libxkbfile-dev \
            libkrb5-dev \
            fakeroot \
            dpkg-dev \
            tar \
            xz-utils

      - name: Check build prerequisites
        run: |
          chmod +x scripts/*.sh *.sh
          bash scripts/check-prerequisites-linux.sh

      - name: Build and package Mobius for Ubuntu (arm64)
        run: |
          bash scripts/package-linux.sh --arch arm64

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobius-ubuntu-arm64
          path: dist/*
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (inputs.release_tag != '' && inputs.release_tag != null)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/*
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
