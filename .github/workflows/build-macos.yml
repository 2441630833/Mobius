name: Build macOS Desktop (.dmg & zip)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target Architecture'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - arm64
          - x64
      release_tag:
        description: 'Existing release tag to publish to; leave empty for artifacts only'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

jobs:
  # =========================================================================
  # macOS Apple Silicon (M1/M2/M3/M4 arm64) Build
  # =========================================================================
  build-macos-arm64:
    name: Build macOS (Apple Silicon arm64)
    if: |
      github.event_name == 'push' ||
      inputs.arch == 'all' ||
      inputs.arch == 'arm64'
    runs-on: macos-14
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout Mobius repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout required submodules (vscode & continue)
        run: |
          git submodule update --init --recursive vscode continue

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check build prerequisites
        run: |
          chmod +x scripts/*.sh *.sh
          bash scripts/check-prerequisites-mac.sh

      - name: Build and package Mobius for macOS Desktop (arm64)
        run: |
          bash scripts/package-mac.sh --arch "arm64"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobius-macos-arm64
          path: dist/*
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (inputs.release_tag != '' && inputs.release_tag != null)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/*
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # macOS Intel (x64) Build
  # =========================================================================
  build-macos-x64:
    name: Build macOS (Intel x64)
    if: |
      github.event_name == 'push' ||
      inputs.arch == 'all' ||
      inputs.arch == 'x64'
    runs-on: macos-15-intel
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout Mobius repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout required submodules (vscode & continue)
        run: |
          git submodule update --init --recursive vscode continue

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check build prerequisites
        run: |
          chmod +x scripts/*.sh *.sh
          bash scripts/check-prerequisites-mac.sh

      - name: Build and package Mobius for macOS Desktop (x64)
        run: |
          bash scripts/package-mac.sh --arch "x64"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobius-macos-x64
          path: dist/*
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (inputs.release_tag != '' && inputs.release_tag != null)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/*
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
